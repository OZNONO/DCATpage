<div class="wrap">
  <header>
    <p class="kicker">DCAT 조건추리</p>
    <h1>조건추리 연습</h1>
    <p class="lead">두 세트, 세트마다 다섯 문제야. 조건을 만족하는 경우를 전부 따져서 만들었기 때문에 정답은 항상 하나뿐이야.</p>
    <dl class="notes">
      <dt>푸는 순서</dt>
      <dd>조건에서 확실하게 정해지는 것부터 표시하고, 남는 경우를 몇 가지로 나눠 보기를 하나씩 대입해 봐. 항상 참이라는 건 나눈 경우가 전부 참이라는 뜻이야.</dd>
      <dt>풀이 구성</dt>
      <dd>풀이에는 조건을 만족하는 경우를 전부 적어뒀어. 틀린 보기는 어느 경우에서 어긋나는지도 같이 적었어.</dd>
    </dl>
    <nav class="jump" aria-label="세트 이동"><a href="#set1">세트 1 기본</a><a href="#set2">세트 2 심화</a></nav>
  </header>
  <main id="root"></main>

<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng){for(var i=arr.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}

/* ---------- 전체 경우의 수(universe) ---------- */
function permUniverse(names){
  var n=names.length,res=[],used=[],cur=[];
  (function rec(i){
    if(i===n){var o={};names.forEach(function(nm,k){o[nm]=cur[k];});res.push(o);return;}
    for(var v=1;v<=n;v++){if(used[v])continue;used[v]=true;cur[i]=v;rec(i+1);used[v]=false;}
  })(0);
  return res;
}
function subsetUniverse(names,k){
  var res=[];
  (function rec(i,chosen){
    if(chosen.length===k){var o={};names.forEach(function(nm){o[nm]=chosen.indexOf(nm)>=0;});res.push(o);return;}
    if(i>=names.length)return;
    rec(i+1,chosen.concat([names[i]]));
    rec(i+1,chosen);
  })(0,[]);
  return res;
}
function culpritUniverse(names){return names.map(function(c){return {c:c};});}

/* ---------- 보기 후보 ---------- */
var THEMES={
  line:{
    at:function(X,k){return X+'는 '+k+'번째에 있다';},
    edge:function(X){return X+'는 맨 앞이나 맨 뒤에 있다';},
    before:function(X,Y){return X+'는 '+Y+'보다 앞에 있다';},
    adj:function(X,Y){return X+'와 '+Y+'는 이웃해 있다';},
    between:function(X,Y,Z){return X+'는 '+Y+'와 '+Z+' 사이에 있다';},
    show:function(sol,names){var arr=[];names.forEach(function(nm){arr[sol[nm]-1]=nm;});return '앞에서부터 '+arr.join(', ');}
  },
  week:{
    days:['월요일','화요일','수요일','목요일','금요일'],
    at:function(X,k){return X+'는 '+this.days[k-1]+'에 당직이다';},
    edge:function(X){return X+'는 월요일이나 금요일에 당직이다';},
    before:function(X,Y){return X+'는 '+Y+'보다 먼저 당직이다';},
    adj:function(X,Y){return X+'와 '+Y+'는 연이은 요일에 당직이다';},
    between:function(X,Y,Z){return X+'의 당직 요일은 '+Y+'와 '+Z+'의 당직 요일 사이에 있다';},
    show:function(sol,names){var arr=[];names.forEach(function(nm){arr[sol[nm]-1]=nm;});return arr.map(function(nm,i){return '월화수목금'[i]+' '+nm;}).join(', ');}
  }
};
function permStatements(names,th){
  var n=names.length,out=[];
  names.forEach(function(X){
    for(var k=1;k<=n;k++)(function(k){out.push({text:th.at(X,k),test:function(s){return s[X]===k;}});})(k);
    out.push({text:th.edge(X),test:function(s){return s[X]===1||s[X]===n;}});
    names.forEach(function(Y){
      if(X===Y)return;
      out.push({text:th.before(X,Y),test:function(s){return s[X]<s[Y];}});
      if(X<Y)out.push({text:th.adj(X,Y),test:function(s){return Math.abs(s[X]-s[Y])===1;}});
      names.forEach(function(Z){
        if(Z===X||Z<=Y)return;
        out.push({text:th.between(X,Y,Z),test:function(s){return (s[X]-s[Y])*(s[X]-s[Z])<0;}});
      });
    });
  });
  return out;
}
function subsetStatements(names){
  var out=[];
  names.forEach(function(X){
    out.push({text:X+'는 선발된다',test:function(s){return s[X];}});
    out.push({text:X+'는 선발되지 않는다',test:function(s){return !s[X];}});
    names.forEach(function(Y){
      if(Y<=X)return;
      out.push({text:X+'와 '+Y+'는 함께 선발된다',test:function(s){return s[X]&&s[Y];}});
      out.push({text:X+'와 '+Y+' 중 적어도 한 명은 선발된다',test:function(s){return s[X]||s[Y];}});
      out.push({text:X+'와 '+Y+' 중 정확히 한 명만 선발된다',test:function(s){return s[X]!==s[Y];}});
      out.push({text:X+'와 '+Y+'는 둘 다 선발되지 않는다',test:function(s){return !s[X]&&!s[Y];}});
    });
  });
  return out;
}
function culpritStatements(names,says){
  var out=[];
  names.forEach(function(X){
    out.push({text:'범인은 '+X+'이다',test:function(s){return s.c===X;}});
    out.push({text:'범인은 '+X+'가 아니다',test:function(s){return s.c!==X;}});
    var sy=says.filter(function(a){return a.who===X;})[0];
    out.push({text:X+'의 진술은 참이다',test:function(s){return sy.f(s.c);}});
    out.push({text:X+'의 진술은 거짓이다',test:function(s){return !sy.f(s.c);}});
    names.forEach(function(Y){
      if(Y<=X)return;
      out.push({text:'범인은 '+X+'나 '+Y+' 중 한 명이다',test:function(s){return s.c===X||s.c===Y;}});
    });
  });
  return out;
}

function vec(U,f){return U.map(function(s){return f(s)?1:0;}).join('');}
function implies(a,b){for(var i=0;i<a.length;i++){if(a[i]==='1'&&b[i]!=='1')return false;}return true;}
function neg(v){return v.split('').map(function(c){return c==='1'?'0':'1';}).join('');}

/* ---------- 문제 만들기 ---------- */
function buildProblem(spec,seed){
  var rng=mulberry32(seed),names=spec.names,U,stmts,show,th;
  if(spec.kind==='perm'){th=THEMES[spec.theme];U=permUniverse(names);stmts=permStatements(names,th);show=function(s){return th.show(s,names);};}
  else if(spec.kind==='subset'){U=subsetUniverse(names,spec.k);stmts=subsetStatements(names);show=function(s){return '{'+names.filter(function(nm){return s[nm];}).join(', ')+'}';};}
  else{U=culpritUniverse(names);stmts=culpritStatements(names,spec.says);show=function(s){return '범인은 '+s.c;};}

  var conds=spec.conds;
  if(spec.kind==='culprit'){
    conds=[{text:spec.condText,test:function(s){var c=0;spec.says.forEach(function(a){if(a.f(s.c))c++;});return spec.condFn(c);}}];
  }
  var sols=U.filter(function(s){return conds.every(function(c){return c.test(s);});});

  var report={cases:sols.length,redundant:[]};
  conds.forEach(function(c,i){
    var rest=conds.filter(function(_,j){return j!==i;});
    var n2=U.filter(function(s){return rest.every(function(d){return d.test(s);});}).length;
    if(n2===sols.length)report.redundant.push(i+1);
  });

  var condV=conds.map(function(c){return vec(U,c.test);});
  var seen={},pool=[];
  stmts.forEach(function(st){
    var v=vec(U,st.test);if(seen[v])return;seen[v]=1;
    var tr=0;sols.forEach(function(s){if(st.test(s))tr++;});
    var cls=tr===sols.length?'always':(tr===0?'never':'some');
    var ask0=spec.ask;
    var trivial=spec.kind==='culprit'?false:ask0==='true'?condV.some(function(cv){return implies(cv,v);}):condV.some(function(cv){return implies(v,neg(cv));});
    pool.push({text:st.text,test:st.test,cls:cls,trivial:trivial});
  });
  var ask=spec.ask;
  var target=ask==='true'?'always':'never';
  var corr=shuffle(pool.filter(function(p){return p.cls===target&&!p.trivial;}),rng);
  if(!corr.length)throw new Error('정답 후보 없음: '+spec.id);
  var right=corr[0];
  var some=shuffle(pool.filter(function(p){return p.cls==='some';}),rng);
  var other=shuffle(pool.filter(function(p){return p.cls===(ask==='true'?'never':'always')&&p!==right;}),rng);
  if(some.length<3||!other.length)throw new Error('오답 후보 부족: '+spec.id+' some '+some.length+' other '+other.length);
  var wrong=[some[0],some[1],some[2],other[0]];
  var order=[],w=shuffle(wrong.slice(),rng),k=0;
  for(var i=0;i<5;i++)order.push(i===spec.ans?right:w[k++]);

  var cases=sols.map(show);
  var verdicts=order.map(function(c,i){
    if(i===spec.ans)return ask==='true'?'모든 경우에서 참이야.':'모든 경우에서 거짓이야.';
    if(ask==='true'){
      if(c.cls==='never')return '모든 경우에서 거짓이야.';
      var j=sols.findIndex(function(s){return !c.test(s);});
      return '경우 '+(j+1)+'에서 거짓이라 항상 참은 아니야.';
    }
    if(c.cls==='always')return '모든 경우에서 참이라 거짓이 아니야.';
    var j2=sols.findIndex(function(s){return c.test(s);});
    return '경우 '+(j2+1)+'에서 참이 될 수 있어.';
  });
  return {spec:spec,hint:spec.hint,order:order,ans:spec.ans,cases:cases,verdicts:verdicts,report:report,
    conds:conds.map(function(c){return c.text;}),
    qtext:ask==='true'?'다음 중 항상 참인 것은?':'다음 중 반드시 거짓인 것은?'};
}

/* ---------- 문제 목록 ---------- */
var L5=['A','B','C','D','E'],L6=['A','B','C','D','E','F'];
var SETS=[
  {id:'set1',title:'세트 1',sub:'기본',
   intro:'조건이 3개에서 4개야. 줄 세우기, 요일 배정, 인원 선발, 거짓말 추리가 한 번씩 나와.',
   probs:[]},
  {id:'set2',title:'세트 2',sub:'심화',
   intro:'조건이 늘고 인원이 6명인 문제가 들어가. 반드시 거짓인 것을 고르는 문제도 있어.',
   probs:[]}
];
function T(s){return s;}
var SPECS=[
  /* 세트 1 */
  {id:'1-1',hint:"C가 D 바로 뒤라서 D와 C는 D, C 순서의 한 덩어리로 움직여. 여기에 A는 B보다 앞, E는 D보다 뒤, B는 2번째가 아니라는 조건을 맞춰 넣으면 5가지가 나와. 5가지 모두 B가 C보다 뒤에 있어서 C는 D와 B 사이에 있게 돼.",set:0,kind:'perm',theme:'line',names:L5,ask:'true',ans:2,
   intro:'A, B, C, D, E 5명이 한 줄로 서 있다. 왼쪽 맨 앞이 1번째, 맨 뒤가 5번째이다.',
   conds:[
     {text:'A는 B보다 앞에 있다.',test:function(p){return p.A<p.B;}},
     {text:'C는 D 바로 뒤에 있다.',test:function(p){return p.C===p.D+1;}},
     {text:'E는 D보다 뒤에 있다.',test:function(p){return p.E>p.D;}},
     {text:'B는 2번째에 있지 않다.',test:function(p){return p.B!==2;}}
   ]},
  {id:'1-2',hint:"조건을 모두 맞추면 수요일은 늘 C이고, 월요일과 화요일은 A와 B가, 목요일과 금요일은 D와 E가 나눠 서. B는 D와 E보다 늘 먼저야.",set:0,kind:'perm',theme:'week',names:L5,ask:'true',ans:0,
   intro:'A, B, C, D, E 5명이 월요일부터 금요일까지 하루씩 당직을 선다. 같은 날 당직인 사람은 없다.',
   conds:[
     {text:'A는 C보다 먼저 당직을 선다.',test:function(p){return p.A<p.C;}},
     {text:'B는 수요일에 당직을 서지 않는다.',test:function(p){return p.B!==3;}},
     {text:'D와 E는 연이은 요일에 당직을 선다.',test:function(p){return Math.abs(p.D-p.E)===1;}},
     {text:'C는 금요일에 당직을 서지 않는다.',test:function(p){return p.C!==5;}},

function buildAll(){
  var sets=SETS.map(function(s){return {id:s.id,title:s.title,sub:s.sub,intro:s.intro,probs:[]};});
  SPECS.forEach(function(sp,i){sets[sp.set].probs.push(buildProblem(sp,9100+i*37));});
  return sets;
}
if(typeof module!=='undefined')module.exports={buildAll:buildAll,buildProblem:buildProblem,SPECS:SPECS};


function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function explain(p){
  var h='<p class="verdict">정답 <b>'+(p.ans+1)+'번</b></p><p class="mine" aria-live="polite"></p>';
  h+='<div><h4>추리 과정</h4><p>'+esc(p.hint)+'</p></div>';
  h+='<div><h4>조건을 모두 만족하는 경우, 전부 '+p.cases.length+'가지</h4><ol class="cases">';
  p.cases.forEach(function(c,i){h+='<li><span>경우 '+(i+1)+'</span><span>'+esc(c)+'</span></li>';});
  h+='</ol></div>';
  h+='<div><h4>보기별 확인</h4><ul class="vd">';
  p.order.forEach(function(c,i){h+='<li><b>'+(i+1)+'번</b> '+esc(p.verdicts[i])+'</li>';});
  h+='</ul></div>';
  return h;
}

function renderProblem(p,si,qi){
  var id='q'+(si+1)+'-'+(qi+1);
  var h='<article class="q" id="'+id+'" data-ans="'+p.ans+'"><h3>문제 '+(qi+1)+'</h3>';
  h+='<p class="setup">'+esc(p.spec.intro)+'</p>';
  if(p.spec.says){
    h+='<ul class="says">';
    p.spec.says.forEach(function(a){h+='<li><b>'+a.who+'</b>'+esc(a.text)+'</li>';});
    h+='</ul>';
  }
  h+='<p class="lab">조건</p><ul class="conds">';
  p.conds.forEach(function(c){h+='<li>'+esc(c)+'</li>';});
  h+='</ul><p class="ask">'+esc(p.qtext)+'</p><ol class="choices">';
  p.order.forEach(function(c,i){
    h+='<li><button type="button" class="opt" data-i="'+i+'" aria-pressed="false"><span class="bub">'+(i+1)+'</span><span class="txt">'+esc(c.text)+'</span></button></li>';
  });
  h+='</ol><details class="ans"><summary>정답과 풀이 보기</summary><div class="body">'+explain(p)+'</div></details></article>';
  return h;
}

function renderAll(){
  var sets=buildAll(),h='';
  sets.forEach(function(s,si){
    h+='<section class="set" id="'+s.id+'"><div class="set-head"><h2>'+s.title+'</h2><span class="tag">'+s.sub+'</span></div>'
      +'<p class="set-intro">'+esc(s.intro)+'</p>'
      +'<div class="set-tools"><button type="button" class="btn" data-toggle="'+s.id+'">풀이 모두 펼치기</button></div>';
    s.probs.forEach(function(p,qi){h+=renderProblem(p,si,qi);});
    h+='</section>';
  });
  document.getElementById('root').innerHTML=h;
}
renderAll();

document.getElementById('root').addEventListener('click',function(e){
  var opt=e.target.closest('.opt');
  if(opt){
    var q=opt.closest('.q'),i=+opt.getAttribute('data-i'),ans=+q.getAttribute('data-ans');
    q.querySelectorAll('.opt').forEach(function(b){b.setAttribute('aria-pressed',b===opt?'true':'false');});
    var m=q.querySelector('.mine');
    if(i===ans){m.className='mine ok';m.textContent='내가 고른 답은 '+(i+1)+'번, 맞았어.';}
    else{m.className='mine no';m.textContent='내가 고른 답은 '+(i+1)+'번, 아쉽게 틀렸어. 정답은 '+(ans+1)+'번이야.';}
    return;
  }
  var t=e.target.closest('[data-toggle]');
  if(t){
    var sec=document.getElementById(t.getAttribute('data-toggle'));
    var open=t.getAttribute('data-open')!=='1';
    sec.querySelectorAll('details.ans').forEach(function(d){d.open=open;});
    t.setAttribute('data-open',open?'1':'0');
    t.textContent=open?'풀이 모두 접기':'풀이 모두 펼치기';
  }
});
</script>
